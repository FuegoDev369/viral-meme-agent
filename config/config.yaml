agent:
  name: viral-meme-agent
  max_candidates_per_run: 5
  min_virality_score: 5

scrapers:
  nitter:
    enabled: false
  reddit:
    enabled: false
  ninegag:
    enabled: false
  memedroid:
    enabled: false
  memeapi:
    enabled: true
    count_per_subreddit: 5
    min_upvotes: 500

media:
  download_dir: /tmp/viral_media
  max_size_mb: 10
  allowed_types:
    - image/jpeg
    - image/png
    - image/gif
    - image/webp
    - video/mp4

tweet_generator:
  language: english
  max_length: 280
  hashtags_count: 3
  style: "engaging, witty, viral, relatable"

notifier:
  telegram:
    enabled: true
  discord:
    enabled: false

# ── LLM Providers ─────────────────────────────────────────────────────────────
gemini:
  model: gemini-2.0-flash-lite   # Primary
  temperature: 0.85

mistral:
  vision_model: mistral-small-latest  # Fallback vision (multimodal)
  text_model: mistral-small-latest    # Fallback tweet gen

groq:
  vision_model: llama-3.2-11b-vision-preview  # Fallback vision
  text_model: llama-3.1-8b-instant            # Fallback tweet gen
