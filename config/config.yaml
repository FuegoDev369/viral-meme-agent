agent:
  name: viral-meme-agent
  max_candidates_per_run: 5   # Max tweets envoyés par run
  min_virality_score: 5       # Score minimum Gemini (1-10) pour envoyer

scrapers:
  # ── Désactivés (instances mortes / compte requis) ──────────────────────────
  nitter:
    enabled: false

  reddit:
    enabled: false

  # ── Actifs (zéro compte requis) ────────────────────────────────────────────
  ninegag:
    enabled: true
    max_posts: 20             # Posts à récupérer depuis le RSS

  memedroid:
    enabled: true
    max_posts: 15             # Posts à récupérer

media:
  download_dir: /tmp/viral_media
  max_size_mb: 50
  allowed_types:
    - image/jpeg
    - image/png
    - image/gif
    - image/webp
    - video/mp4

tweet_generator:
  language: english
  max_length: 280
  hashtags_count: 3
  style: "engaging, witty, viral, relatable"

notifier:
  telegram:
    enabled: true   # false pour désactiver
  discord:
    enabled: false   # false pour désactiver

gemini:
  model: gemini-2.0-flash
  temperature: 0.85
