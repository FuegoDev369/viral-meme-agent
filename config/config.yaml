agent:
  name: viral-meme-agent
  max_candidates_per_run: 5
  min_virality_score: 5

scrapers:
  # ── Désactivés ─────────────────────────────────────────────────────────────
  nitter:
    enabled: false      # instances mortes

  reddit:
    enabled: false      # requiert un compte

  ninegag:
    enabled: false      # RSS supprimé (404)

  memedroid:
    enabled: false      # API morte (404)

  # ── Actif ──────────────────────────────────────────────────────────────────
  memeapi:
    enabled: true
    count_per_subreddit: 5    # Posts demandés par subreddit
    min_upvotes: 500          # Upvotes minimum pour considérer un post

media:
  download_dir: /tmp/viral_media
  max_size_mb: 50
  allowed_types:
    - image/jpeg
    - image/png
    - image/gif
    - image/webp
    - video/mp4

tweet_generator:
  language: english
  max_length: 280
  hashtags_count: 3
  style: "engaging, witty, viral, relatable"

notifier:
  telegram:
    enabled: true
  discord:
    enabled: false    # Mettre true + ajouter DISCORD_WEBHOOK_URL si besoin

gemini:
  model: gemini-2.0-flash-lite
  temperature: 0.85
